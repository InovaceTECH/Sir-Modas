services:
  database:
    image: postgres:17-alpine
    container_name: sir-modas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sirmodas
      POSTGRES_USER: sirmodas
      POSTGRES_PASSWORD: sirmodas_local
    ports:
      - "5434:5432"
    volumes:
      - sir_modas_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sirmodas -d sirmodas"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  sir_modas_postgres_data:
